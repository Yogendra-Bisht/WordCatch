<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>WordCatch - Instant Vocabulary Builder Extension</title>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }
    .container {
      max-width: 600px;
      background: var(--card-bg);
      padding: 2.5rem;
      border-radius: 12px;
      border: 1px solid var(--border);
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
    }
    h1 { font-size: 2.2rem; color: var(--accent); margin-bottom: 0.5rem; }
    p { color: var(--text-muted); margin-bottom: 1.5rem; font-size: 1.1rem; }
    .nav-links {
      display: flex;
      gap: 1rem;
      justify-content: center;
      margin-top: 2rem;
    }
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      background: var(--accent);
      color: #0f172a;
      font-weight: 600;
      border-radius: 6px;
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.9; }
    .btn-secondary {
      background: transparent;
      color: var(--accent);
      border: 1px solid var(--accent);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>WordCatch 📖</h1>
    <p>Double-click any word on any webpage to instantly look up definitions and build your personal vocabulary list.</p>
    <div class="nav-links">
      <a href="privacy.html" class="btn">Privacy Policy</a>
      <a href="https://github.com/Yogendra-Bisht/WordCatch" class="btn btn-secondary" target="_blank">GitHub Repository</a>
    </div>
  </div>
</body>
</html>
