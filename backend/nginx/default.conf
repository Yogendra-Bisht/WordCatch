# ── Rate limiting zones (NFR-7) ────────────────────────────────────────────
# Defined in the http block; included from nginx.conf or the default server conf.
# 10m zone holds ~160k IP addresses.
limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;

server {
    listen 80;
    server_name _;

    # ── Redirect all HTTP → HTTPS (NFR-3) ──────────────────────────────────
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name your-domain.com;   # ← replace with your registered domain

    # ── TLS (NFR-3) ────────────────────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # ── Security headers ───────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;

    # ── IP-level rate limiting (NFR-7) ────────────────────────────────────
    # Allows short bursts (nodelay) but enforces the 20 r/s zone average.
    limit_req zone=global burst=40 nodelay;
    limit_req_status 429;

    # ── Proxy to Express API ───────────────────────────────────────────────
    location / {
        proxy_pass         http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # ── Health endpoint — bypass rate limit for monitoring ─────────────────
    location = /health {
        limit_req off;
        proxy_pass http://api:3000/health;
    }
}
